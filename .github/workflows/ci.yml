name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: veloexpress_ci
          POSTGRES_USER: veloexpress
          POSTGRES_PASSWORD: veloexpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloexpress -d veloexpress_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://veloexpress:veloexpress@localhost:5432/veloexpress_ci
      TEST_POSTGRES_URL: postgresql+asyncpg://veloexpress:veloexpress@localhost:5432/veloexpress_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Migrate empty Postgres database
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

      - name: Docker build
        run: docker compose -f docker-compose.local.yml build bot

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format-check
      - run: npm run test
      - run: npm run build
      - run: docker build -t veloexpress-web-review .

  deploy:
    name: Deploy production to Coolify
    needs: [check, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    concurrency:
      group: coolify-main
      cancel-in-progress: false
    steps:
      - name: Deploy the current tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEPLOY_BRANCH}" --jq .commit.sha)
          if [ "$latest_sha" != "$TESTED_SHA" ]; then
            echo "A newer commit exists; its CI run will deploy it."
            exit 0
          fi
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Configure COOLIFY_WEBHOOK and COOLIFY_TOKEN in the Production GitHub environment."
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "$COOLIFY_WEBHOOK" > /dev/null
