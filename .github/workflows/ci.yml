name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: veloexpress_ci
          POSTGRES_USER: veloexpress
          POSTGRES_PASSWORD: veloexpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloexpress -d veloexpress_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://veloexpress:veloexpress@localhost:5432/veloexpress_ci
      TEST_POSTGRES_URL: postgresql+asyncpg://veloexpress:veloexpress@localhost:5432/veloexpress_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Migrate empty Postgres database
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

      - name: Docker build
        run: docker compose -f docker-compose.local.yml build bot
