name: CD / Coolify

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Trigger Coolify dev deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'dev') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
      }}
    environment: Development
    concurrency:
      group: cd-coolify-development
      cancel-in-progress: false
    steps:
      - name: Check Coolify secrets
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          missing=false

          if [[ -z "$COOLIFY_WEBHOOK" ]]; then
            echo "COOLIFY_WEBHOOK is not configured."
            missing=true
          fi

          if [[ -z "$COOLIFY_TOKEN" ]]; then
            echo "COOLIFY_TOKEN is not configured."
            missing=true
          fi

          if [[ "$missing" == "true" ]]; then
            exit 1
          fi

      - name: Trigger deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

  deploy-production:
    name: Trigger Coolify production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
      }}
    environment: Production
    concurrency:
      group: cd-coolify-production
      cancel-in-progress: false
    steps:
      - name: Check Coolify secrets
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          missing=false

          if [[ -z "$COOLIFY_WEBHOOK" ]]; then
            echo "COOLIFY_WEBHOOK is not configured."
            missing=true
          fi

          if [[ -z "$COOLIFY_TOKEN" ]]; then
            echo "COOLIFY_TOKEN is not configured."
            missing=true
          fi

          if [[ "$missing" == "true" ]]; then
            exit 1
          fi

      - name: Trigger deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
