services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://veloexpress:veloexpress@db:5432/veloexpress}
      APP_HEALTH_HEARTBEAT_FILE: ${APP_HEALTH_HEARTBEAT_FILE:-/tmp/veloexpress-bot-heartbeat.json}
      APP_HEALTH_HEARTBEAT_INTERVAL_SECONDS: ${APP_HEALTH_HEARTBEAT_INTERVAL_SECONDS:-15}
      APP_HEALTH_MAX_AGE_SECONDS: ${APP_HEALTH_MAX_AGE_SECONDS:-90}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "veloexpress_bot.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veloexpress}
      POSTGRES_USER: ${POSTGRES_USER:-veloexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veloexpress}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

volumes:
  postgres-data:
