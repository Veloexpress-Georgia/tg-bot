# Intended for a Coolify Git-based Docker Compose application.
# The build context assumes Coolify has checked out this repository.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-veloexpress}
      POSTGRES_USER: ${POSTGRES_USER:-veloexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veloexpress}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      APP_HEALTH_HEARTBEAT_FILE: ${APP_HEALTH_HEARTBEAT_FILE:-/tmp/veloexpress-bot-heartbeat.json}
      APP_HEALTH_HEARTBEAT_INTERVAL_SECONDS: ${APP_HEALTH_HEARTBEAT_INTERVAL_SECONDS:-15}
      APP_HEALTH_MAX_AGE_SECONDS: ${APP_HEALTH_MAX_AGE_SECONDS:-90}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:?TELEGRAM_ADMIN_IDS is required}
      TELEGRAM_TARGET_CHAT_ID: ${TELEGRAM_TARGET_CHAT_ID:?TELEGRAM_TARGET_CHAT_ID is required}
      TELEGRAM_TARGET_THREAD_ID: ${TELEGRAM_TARGET_THREAD_ID:-}
      TELEGRAM_PIN_POLL: ${TELEGRAM_PIN_POLL:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "veloexpress_bot.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veloexpress}
      POSTGRES_USER: ${POSTGRES_USER:-veloexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veloexpress}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
