[project]
name = "veloexpress-bot"
version = "0.1.0"
description = "Telegram admin bot for Veloexpress lift polls."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "aiogram>=3.28,<4",
    "alembic>=1.17,<2",
    "asyncpg>=0.31,<1",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
    "watchfiles>=1.1,<2",
]

[project.scripts]
veloexpress-bot = "veloexpress_bot.__main__:main"
veloexpress-bot-healthcheck = "veloexpress_bot.healthcheck:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
